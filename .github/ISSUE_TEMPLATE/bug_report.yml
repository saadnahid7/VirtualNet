name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: android
    attributes:
      label: Android version and ROM
      placeholder: Android 15, LineageOS 22
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework and version
      placeholder: Vector 2.2
    validations:
      required: true
  - type: dropdown
    id: coverage
    attributes:
      label: Coverage setting
      options: [System, Apps, Both]
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Scope entries you added
      placeholder: System Framework, Phone Services, the app
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
  - type: textarea
    id: lab
    attributes:
      label: Lab app report
      description: Open VirtualNet Lab, tap Copy report, paste here.
